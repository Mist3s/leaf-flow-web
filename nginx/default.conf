# Определяем поисковых ботов по User-Agent
map $http_user_agent $is_crawler {
    default 0;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*yandex 1;
    ~*baiduspider 1;
    ~*facebookexternalhit 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*slackbot 1;
    ~*telegrambot 1;
    ~*whatsapp 1;
    ~*applebot 1;
    ~*duckduckbot 1;
    ~*seznambot 1;
    ~*mj12bot 1;
    ~*ahrefsbot 1;
    ~*semrushbot 1;
    ~*rogerbot 1;
    ~*embedly 1;
    ~*quora 1;
    ~*pinterest 1;
    ~*vkShare 1;
}

server {
    listen 80;
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Статические ресурсы (js, css) — кэширование на год
    location ~* ^/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Статические файлы в корне
    location ~* ^/(favicon\.ico|logo\.png|robots\.txt|sitemap\.xml|_redirects)$ {
        try_files $uri =404;
        expires 1d;
    }

    # 404.html — для internal redirect
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Иконки
    location ~* ^/icon/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Главная страница
    location = / {
        try_files /index.html =404;
    }

    # Статические страницы (всегда prerendered)
    location ~* ^/(delivery|privacy|offer|about)/?$ {
        try_files $uri $uri/index.html /index.html;
    }

    # Каталог категорий (prerendered)
    location ~* ^/catalog/[^/]+/?$ {
        try_files $uri $uri/index.html /index.html;
    }

    # Страницы требующие авторизации (не индексируются, SPA)
    location ~* ^/(cart|checkout|profile|auth)/?$ {
        try_files /index.html =404;
    }

    # КЛЮЧЕВОЕ: Страницы продуктов
    # Если есть prerendered → отдаём, иначе → @product_fallback
    location ~* ^/product/[^/]+/?$ {
        try_files $uri $uri/index.html @product_fallback;
    }

    # Fallback для продуктов: боты → 404, пользователи → SPA
    location @product_fallback {
        if ($is_crawler = 1) {
            return 404;
        }
        try_files /index.html =404;
    }

    # Всё остальное
    location / {
        try_files $uri $uri/index.html @fallback;
    }

    # Общий fallback
    location @fallback {
        if ($is_crawler = 1) {
            return 404;
        }
        try_files /index.html =404;
    }

    # Обработка 404 — показываем красивую страницу
    error_page 404 /404.html;
}
